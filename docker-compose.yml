# Auditoria de balancetes: banco de dados (PostgreSQL 16 + pgvector).
# Subir:  docker compose up -d
# Porta 5433 (a 5432 é do chat-local). Só acessível nesta máquina.
name: auditoria-pcsf   # não mude: define o nome do volume do banco (auditoria-pcsf_pgdata)

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auditoria}
      POSTGRES_USER: ${POSTGRES_USER:-auditoria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auditoria} -d ${POSTGRES_DB:-auditoria}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
